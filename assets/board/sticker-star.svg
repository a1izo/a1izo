<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="star"><title>star</title>
<style>
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  .beat{transform-box:fill-box;transform-origin:center;animation:beat 1.4s ease-in-out infinite}
  .blink{transform-box:fill-box;transform-origin:center;animation:blink 2.2s ease-in-out infinite}
  .blink2{transform-box:fill-box;transform-origin:center;animation:blink 2.2s ease-in-out 1.1s infinite}
  .bob{animation:bob 3s ease-in-out infinite}
  .swipe{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:swipe 4.5s ease-in-out infinite}
  .cursor{animation:cur 1s steps(1) infinite}
  .march{animation:march 1.6s linear infinite}
  .float{animation:float 3.6s ease-in infinite}
  .float2{animation:float 3.6s ease-in 1.8s infinite}
  .wiggle{transform-box:fill-box;transform-origin:center;animation:wig 2.6s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(.96)}45%{transform:scale(1.12)}}
  @keyframes blink{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes swipe{0%{stroke-dashoffset:var(--len)}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:calc(var(--len) * -1)}}
  @keyframes cur{50%{opacity:0}}
  @keyframes march{to{stroke-dashoffset:-24}}
  @keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
  @keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><path class="spin" d="M20.0 4.5 L24.2 14.7 L35.2 15.6 L26.8 22.7 L29.4 33.4 L20.0 27.7 L10.6 33.4 L13.2 22.7 L4.8 15.6 L15.8 14.7Z" fill="#FF7AB6" stroke="#18161A" stroke-width="2.5" stroke-linejoin="round"/></svg>